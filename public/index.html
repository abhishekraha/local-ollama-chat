<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Qwen Chat</title>
    <link rel="stylesheet" href="/styles.css?v=20260510-3" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Conversations">
        <div class="brand">
          <div class="brand-mark">Q</div>
          <div>
            <strong>Qwen Chat</strong>
            <span>Local Ollama</span>
          </div>
        </div>
        <button class="new-chat" id="newChatButton" type="button">+ New chat</button>
        <nav class="sessions" id="sessionsList"></nav>
        <div class="connection">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Checking Ollama</span>
        </div>
      </aside>

      <main class="chat-area">
        <header class="topbar">
          <div>
            <h1>Chat</h1>
            <p>Qwen2.5 7B through your local Docker Ollama instance</p>
          </div>
          <div class="settings">
            <div class="top-status" id="topStatus">
              <span class="status-dot" id="topStatusDot"></span>
              <span id="topStatusText">Checking Ollama</span>
            </div>
            <label>
              Model
              <select id="modelSelect">
                <option value="qwen2.5:7b">qwen2.5:7b</option>
              </select>
            </label>
            <label>
              Temp
              <input id="temperatureInput" type="number" min="0" max="2" step="0.1" value="0.7" />
            </label>
          </div>
        </header>

        <section class="messages" id="messages" aria-live="polite"></section>

        <form class="composer" id="composer">
          <textarea
            id="promptInput"
            rows="1"
            placeholder="Ask Qwen anything..."
            autocomplete="off"
          ></textarea>
          <div class="composer-actions">
            <button id="stopButton" class="secondary" type="button" hidden>Stop</button>
            <button id="sendButton" type="submit">Send</button>
          </div>
        </form>
      </main>
    </div>

    <template id="emptyStateTemplate">
      <div class="empty-state">
        <h2>What are we building today?</h2>
        <p>Ask for code, explanations, debugging help, writing, planning, or a second pair of eyes.</p>
        <div class="suggestions">
          <button type="button">Help me design a React component</button>
          <button type="button">Explain this error message</button>
          <button type="button">Draft a project plan</button>
          <button type="button">Review an API idea</button>
        </div>
      </div>
    </template>

    <script src="/app.js?v=20260510-3" type="module"></script>
  </body>
</html>
